id: netsuite
nombre: Oracle NetSuite
segmento_panama: Multilatinas, tecnología y servicios 100 % en la nube
motor_origen: NetSuite General Ledger Detail / Saved Searches (Transaction)
formatos_frecuentes: [csv, xlsx]
orden_ui: 8
descripcion: >
  Exportaciones de General Ledger Detail y Saved Searches de NetSuite con campos estándar
  Document Number, Internal ID, Account, Memo, Amount (Debit)/(Credit) y Created By.
aliases:
  asiento: [Document Number, Tran ID, Internal ID, Transaction Number]
  linea: [Line ID, Line Sequence Number, Line]
  fecha: [Date, Trandate]
  cuenta: [Account, Account Number]
  descripcion: [Memo, Memo (Main), Description]
  monto: [Amount, Amount (Net)]
  usuario: [Created By, Set By]
debito_credito_pares:
  - [Amount (Debit), Amount (Credit)]
  - [Debit, Credit]
indicador_dc: null
separador_decimal: "."
formato_fecha: null
generar_linea_si_falta: true
usuario_defecto_si_falta: "(sin usuario en origen)"
consultas_sql: []
